<style>
:root{--bg:#111a1f;--card:#1b2730;--line:#2a3b46;--tx:#e8eef1;--mut:#8fa1ab;--red:#b02530;--go:#2e9e5b;--cau:#d9a21b;--no:#c8323c;--chip:#223340}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom,0)}
header{background:#3d3935;border-bottom:4px solid var(--red);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff}
header small{display:block;font-weight:400;color:#cfc8c0;letter-spacing:.04em;font-size:12px;text-transform:none}
main{padding:16px 18px 40px;max-width:720px;margin:auto}
h1{margin:6px 0 4px;font-size:28px;font-weight:300;text-transform:uppercase;line-height:1.1}h1 b{display:block;font-weight:800}
p.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
nav{display:flex;gap:6px;margin:12px 0 14px;overflow-x:auto}
nav button{flex:1 0 auto;padding:12px 10px}
button{font:inherit;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
button.on,button.red{background:var(--red);border-color:var(--red);color:#fff}
label{display:block;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
input,select{width:100%;font:inherit;font-size:17px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:12px}.g .w{grid-column:1/-1}
h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px;border-top:1px solid var(--line);padding-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mut);border-radius:10px;padding:12px 14px;margin:10px 0}
.card.GO{border-left-color:var(--go)}.card.CAUTION,.card.REVIEW{border-left-color:var(--cau)}.card.NO,.card.SEVERE{border-left-color:var(--no)}
.card h4{margin:0 0 6px;font-size:16px}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:3px 8px;font-size:13px;margin:0 6px 6px 0;font-family:ui-monospace,Menlo,monospace}
.badge{display:inline-block;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:800;letter-spacing:.06em;color:#fff;background:#556}
.badge.GO{background:var(--go)}.badge.CAUTION,.badge.REVIEW{background:var(--cau);color:#111}.badge.NO,.badge.SEVERE{background:var(--no)}
.ban{border-radius:10px;padding:14px;margin:6px 0 4px;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--mut)}
.ban b{font-size:19px;display:block}.ban.GO{border-left-color:var(--go)}.ban.REVIEW{border-left-color:var(--cau)}.ban.NO{border-left-color:var(--no)}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
tr.pick td{background:#2a1c21}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.kv{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding:3px 0}.kv span{color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.kv b{font-weight:600;word-break:break-word}
.notes p{margin:6px 0}
.app-brand{display:block;width:132px;height:auto;margin-bottom:8px}.report-brand{background:#fff;border-radius:8px;padding:12px 15px;margin:10px 0}.report-mark{display:block;width:132px;height:auto}
.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-grid figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;break-inside:avoid}.photo-grid img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;background:var(--card)}.photo-grid figcaption{padding:8px;font-size:13px}.photo-grid button{display:block;margin-top:6px}
@media print{
 .report-brand{padding:0 0 10px;margin:0;break-after:avoid}.tw{overflow:visible}table{font-size:10px}th,td{white-space:normal;padding:4px}
 :root{--bg:#fff;--card:#fff;--tx:#000;--mut:#555;--line:#bbb;--chip:#eee}
 header,nav,.noprint,h1,p.sub{display:none!important}
 main{padding:0;max-width:none}.card,.ban,.kv{break-inside:avoid}
}
</style>

function roundPitch(x){var fr=Math.round((x%1)*1e6)/1e6;return Math.floor(x)+(fr<=0.3?0:fr<0.8?0.5:1)}

 if(s.regime==="Planing"){var C=n(s.C);return C>0?C*Math.sqrt(hpT/(m*K.lb)):NaN}
 var e=expo(s),rk=n(s.refKn),rh=n(s.refHp),rm=n(s.refKg);

 var e=expo(s),rk=n(s.refKn),rh=n(s.refHp),rm=n(s.refKg);
 return(rk>0&&rh>0&&rm>0&&e[0]>0&&e[1]>0)?rm*Math.pow(rk*Math.pow(hpT/rh,e[0])/mk,1/e[1]):NaN}

 var E=n(s.engines),slip=n(s.slip)/100,lim=R.limit,minKn=n(s.minKn),top=n(s.topKn);

 if(minKn>0)[nm.kn,fl.kn,r.mpSpeed].forEach(function(x){if(isFinite(x)&&x<minKn)short=true});

function crouchTargets(s){
 if(s.regime!=="Planing")return "";
 var kg=n(s.mNorm), e=n(s.engines), hp=e*n(R.hp);
 if(!(kg>0&&hp>0&&Number.isInteger(e)))return '<h3>Crouch target calculator</h3><p class="mut">Enter normal operating weight and engine count to calculate the required C.</p>';
 var factor=Math.sqrt(kg*2.204622622/hp), min=n(s.minKn), top=n(s.topKn), loa=n(s.loa), beam=n(s.beam);
 return '<h3>Crouch target calculator · normal load</h3><div class="card"><p>Required C for desired top speed: <b>'+ (top>0?f(top*factor,1):"Enter desired top speed")+'</b><br>Required C for minimum speed: <b>'+(min>0?f(min*factor,1):"Enter minimum speed")+'</b><br>Assumed Planing C: <b>'+(n(s.C)>0?f(n(s.C),1):"Not entered")+'</b></p><p class="mut">'+f(kg,0)+' kg · '+f(hp,0)+' total shaft hp'+(loa>0&&beam>0?' · LOA/beam '+f(loa/beam,2):'')+'. Length and beam are recorded for comparison; they do not enter the Crouch equation. Required C is a target threshold, not a hull calibration.</p></div>';
}

function trial(v){
 var fl=[["WOT RPM","rpm"],["Run distance (nm, each leg)","dist"],["Out time (s)","out"],["Back time (s)","back"],["Nominal pitch (in)","pitch"]];

function tr(){
 var d=n(T.dist),a=n(T.out),b=n(T.back),rpm=n(T.rpm),p=n(T.pitch),el=document.getElementById("tr");if(!el)return;
 if(!(d>0&&a>0&&b>0)){el.innerHTML='<div class="ban REVIEW"><b>Enter distance and both times</b></div>';return}
 var vo=d*3600/a,vb=d*3600/b,m=2*d*3600/(a+b),h='<div class="ban GO"><span class="mut">MEAN SPEED</span><b>'+f(m,2)+' kn</b><span class="mut">Out '+f(vo)+' kn · Back '+f(vb)+' kn · difference '+f(Math.abs(vo-vb))+" kn</span></div>";

function compressPhoto(file){
 return new Promise(function(resolve,reject){
  var url=URL.createObjectURL(file),im=new Image();
  im.onerror=function(){URL.revokeObjectURL(url);reject(new Error("This photo could not be opened. Try taking a new photo or importing a JPEG or PNG."))};
  im.onload=function(){
   URL.revokeObjectURL(url);
   try{
    var c=document.createElement("canvas"), edge=1200, src;
    do {
     var scale=Math.min(1,edge/Math.max(im.naturalWidth,im.naturalHeight));
     c.width=Math.max(1,Math.round(im.naturalWidth*scale));
     c.height=Math.max(1,Math.round(im.naturalHeight*scale));
     var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);
     src=c.toDataURL("image/jpeg",.76);edge=Math.floor(edge*.72);
    }while(src.length>140000&&edge>=320);
    if(!src.startsWith("data:image/jpeg;base64,")||src.length>140000)throw new Error("Could not resize this photo. Try importing a smaller copy.");
    resolve({src:src});
   }catch(e){reject(e)}
  };
  im.src=url;
 });
}

 var status=v.querySelector("#photo-status"), list=v.querySelector("#photo-list");
 function render(){list.innerHTML=items.length?photoCards(items,true):'<p class="mut">No vessel photos yet.</p>'}
 function persist(next){
  var prev=owner.photos;owner.photos=next;
  if(!save("ax300.cur",owner)){owner.photos=prev;return false}items=next;return true;
 }
 async function add(e){
  var files=Array.from(e.target.files||[]);e.target.value="";
  if(busy||!files.length)return;
  busy=true;status.textContent="Preparing photos…";
  var msg=[];
  for(var file of files){
   if(items.length>=6){msg.push("Six-photo limit reached.");break}
   try{
    var image=await compressPhoto(file);
    if(owner!==S)break;
    if(!persist(items.concat(image))){msg.push("Phone storage is full or unavailable. Photo was not added.");break}
   }catch(err){msg.push(err.message||"Could not import this photo.")}
  }
  busy=false;render();status.textContent=msg.length?msg.join(" "):"Photos added to the current assessment.";
 }

  var i=e.target.dataset.removePhoto;
  if(i==null||busy)return;
  if(persist(items.filter(function(_,k){return k!==Number(i)}))){render();status.textContent="Photo removed."}
  else status.textContent="Could not save the change.";

}

function csv(){var L=load("ax300.log",[]),q=function(x){return'"'+String(x).replace(/"/g,'""')+'"'};
 var rows=[["Saved","Vessel","Customer","Hull","Regime","Decision","Normal kg","Normal kn","Full kg","Full kn","Req pitch in","Candidate in"]];
 L.forEach(function(e){var r=calc(Object.assign({},BLANK,e.s)),a=r.cases[1],z=r.cases[2];rows.push([e.t,e.s.name,e.s.company,e.s.hullForm||"",e.s.regime||"",e.dec,a.m,f(a.kn,2),z.m,f(z.kn,2),f(a.req,2),a.cand])});
 return rows.map(function(r){return r.map(q).join(",")}).join("\n")}
function saved(v){
 var L=load("ax300.log",[]);
 var h='<p class="mut">'+L.length+' saved on this phone. Nothing is sent anywhere.</p><div class="row"><button class="red" id="ex">Export CSV</button><button id="cp">Copy CSV</button><button id="cr">Clear all</button></div><div class="row"><label style="cursor:pointer;margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--tx);font-weight:700;letter-spacing:.05em;font-size:13px">Import report<input id="imf" type="file" accept=".json,application/json" style="display:none"></label></div>';
 L.forEach(function(e,i){var r=calc(Object.assign({},BLANK,e.s));h+='<div class="card '+bcls(r)+'"><h4>'+esc(e.s.name||"Unnamed")+'</h4><span class="mut">'+new Date(e.t).toLocaleString()+"</span><br>"+badge(bcls(r),e.dec)+'<div class="row"><button data-o="'+i+'">Open</button><button data-d="'+i+'">Delete</button></div></div>'});
 v.innerHTML=h;
 v.onclick=function(e){var o=e.target.dataset.o,d=e.target.dataset.d;
  if(o!=null){S=restoreAssessment(L[o].s);save("ax300.cur",S);tab="assess";location.hash="assess";draw()}
  if(d!=null){L.splice(d,1);save("ax300.log",L);saved(v)}};
 document.getElementById("ex").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv()],{type:"text/csv"}));a.download="ax300-assessments.csv";a.click()};
 document.getElementById("cp").onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(csv()).then(function(){alert("Copied")})};
 document.getElementById("cr").onclick=function(){if(confirm("Delete all saved assessments?")){save("ax300.log",[]);saved(v)}};
 document.getElementById("imf").onchange=function(e){importFile(e.target.files[0],function(){saved(v)})}}
// ---- Share and import ----
function keysOK(){var k=[];FIELDS.forEach(function(d){if(d[0]!=="#")k.push(d[1])});return k}
function summary(r,F){var nm=r.cases[1],fl=r.cases[2];
 return["AX300 Application Assessment",S.name||"Unnamed vessel",((S.company||"")+" "+(S.location||"")).trim(),"Decision: "+r.dec,r.next,
 "Normal load: "+f(nm.kn)+" kn, required pitch "+f(nm.req,2)+" in, candidate "+(nm.cand>0?nm.cand+" in":"-"),
 "Full load: "+f(fl.kn)+" kn, required pitch "+f(fl.req,2)+" in, candidate "+(fl.cand>0?fl.cand+" in":"-"),
 "Minimum "+f(n(S.minKn))+" kn / top "+f(n(S.topKn))+" kn / cruise "+f(n(S.cruKn))+" kn",
 "Range at cruise: "+f(F.rng,0)+" nm","Design estimate only. Confirm by sea trial."].join("\n")}
function payload(r,F){var inp={};keysOK().forEach(function(k){if(S[k]!=null&&S[k]!=="")inp[k]=S[k]});
 return{app:"ax300-assessment",v:1,created:new Date().toISOString(),inputs:inp,constants:R,
 results:{decision:r.dec,note:r.next,cases:r.cases.map(function(c){return{name:c.name,kg:c.m,kn:c.kn,reqPitch:c.req,candidate:c.cand,status:c.st}}),fuel:F},summary:summary(r,F)}}
async function shareReport(){
 var r=calc(S),F=fuel(S,r),pl=payload(r,F),json=JSON.stringify(pl,null,1),
 name="AX300_"+(S.name||"vessel").replace(/[^A-Za-z0-9]+/g,"_")+"_"+new Date().toISOString().slice(0,10)+".json",
 to=(document.getElementById("em").value||"").trim(),subj="AX300 Assessment - "+(S.name||"vessel")+" - "+r.dec;
 save("ax300.mail",to);
 try{var fl=new File([json],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[fl]})){await navigator.share({files:[fl],title:subj,text:pl.summary});return}}catch(e){if(e&&e.name==="AbortError")return}
 try{var d=window.claude&&await window.claude.use("downloads");
  if(d)await d.save({filename:name,data:json});
  else{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;a.click()}}catch(e){}
 location.href="mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(pl.summary+"\n\nAttach the downloaded file: "+name)}
function importFile(file,done){
 if(!file)return;if(file.size>200000){alert("File too large to be an AX300 report.");return}
 var rd=new FileReader();rd.onload=function(){
  try{var p=JSON.parse(rd.result);if(!p||p.app!=="ax300-assessment"||typeof p.inputs!=="object")throw 0;
   var s=Object.assign({},BLANK),ok=keysOK();
   Object.keys(p.inputs).forEach(function(k){var x=p.inputs[k];if(ok.indexOf(k)>=0&&(typeof x==="string"||typeof x==="number"))s[k]=String(x).slice(0,200)});
   var L=load("ax300.log",[]);L.unshift({t:p.created||new Date().toISOString(),s:s,dec:calc(s).dec});save("ax300.log",L);alert("Imported: "+(s.name||"Unnamed vessel"));done()}
  catch(e){alert("This file is not an AX300 assessment report.")}};
 rd.readAsText(file)}
draw();

</script>
</body>
</html>
